<li>
    基本操作
    <ul>
        <li>
            <span class="script">Ctrl</span>キーを押しながら項目をクリックすると<b>複数選択</b>を行います。
        </li>
        <li>
            <span class="script">Shift</span>キーを押しながら項目をクリックすると<b>範囲選択</b>を行います。
        </li>
        <li>
            <span class="script">Alt</span>キーを押しながら項目をクリックすると、<b>その項目だけを選択状態</b>にし、<br>
            山括弧<span class="script">《》</span>で囲ったカード名をクリップボードにコピーします。
        </li>
    </ul>
</li>
