<!DOCTYPE html>
<html>
    <head>
        <meta content="text/html" charset="UTF-8" http-equiv="content-type">
        <title>YuGiOh Database</title>
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="stylesheet" type="text/css" href="livre_noir.css">
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div class="content">
            <div class="stack">
                <a href="https://github.com/Kuroki-Narumi/LN-YuGiOhDatabase" target="_blank">
                    <img src="img/splash.png" style="max-width: 100%;"/><br>
                    Version 2.0.0<br>
                </a>
                遊戯王カードの情報を調べたりなんかできるやつです。<br>
            </div>
            <h1 style="color:#f44;">現在のマニュアルは旧バージョンの内容になっています。</h1>
            <div class="stack">
                <h2>注意</h2>
                <ul>
                    <li>
                        起動には<a href="https://dotnet.microsoft.com/ja-jp/download/dotnet/10.0/runtime" target="_blank">.NET Runtime (10.0以上)</a>のインストールが必要です。
                    </li>
                    <li>
                        アプリの設定内容は<span class="script">(ユーザー)/AppData/Local/LivreNoir/YuGiOh/SettingsV2.json</span>に保存されます。設定を初期化したい場合はファイルを削除してください。
                    </li>
                </ul>
                <p>
                    不明な点や要望があればROKINA(<a href="https://twitter.com/lokina" target="_blank">twitter</a>)までご連絡ください。
                </p>
            </div>
            <div class="stack">
                <iframe style="width: 560px; height: 315px;" src="https://www.youtube.com/embed/mY8dNSdDytk?si=ej0iC3pYNoXmC_6Y" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

            </div>
        </div>
        <script type="text/javascript" src="script.js"></script>
    </body>
</html>
