<!DOCTYPE html>
<html>
    <head>
        <meta content="text/html" charset="UTF-8" http-equiv="content-type">
        <title>LN YuGiOh Database</title>
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div class="content">
            <div class="stack">
                <h1>データベース&gt;パックリスト</h1>
                <p>
                    『遊戯王OCG』(及び『Yu-Gi-Oh! TCG』)で発売済みのパックを確認できます。
                </p>
            </div>
            <div class="stack">
                <h2>説明</h2>
                要素をクリックすると説明が表示されます。
                <div class="image-map" src="img/01_02_database_pack.png" maps="
                       1, 31,659, 56, popup/tab.html;
                     963, 31, 55, 27, popup/link_db.html;
                    1018, 31, 24, 27, popup/help.html;
                     949, 60, 94, 24, popup/database_update.html;
                       5, 89,260, 27, popup/searchText_pack.html;
                     265, 89, 22, 27, popup/openSearch_pack.html;
                     287, 89, 22, 27, popup/search_clear.html;
                     309, 89, 40, 27, popup/listCount.html;
                       5,120,344,558, popup/packList.html, top;
                     353, 89,690, 31, popup/packName.html;
                     353,120,150, 26, popup/packDate.html;
                     503,120,150, 26, popup/packCount.html;
                     892,120, 98, 26, popup/packId.html;
                     990,120, 51, 26, popup/link_packData.html;
                     353,146,688,532, popup/pack_cardList.html, top;
                    ">
                </div>
            </div>
            <div class="stack" id="search">
                <h2>パック検索ウィンドウ</h2>
                要素をクリックすると説明が表示されます。
                <div class="image-map" src="img/01_02_pack_search.png" maps="
                       4,  4, 60, 31, popup/search_apply.html;
                      68,  4, 74, 31, popup/search_default.html;
                     362,  4, 74, 31, popup/search_close.html;
                       9, 44,422, 29, popup/search_date_pack.html;
                       9, 78,422, 35, popup/search_locale_pack.html;
                       9,118,422, 62, popup/search_text.html;
                    ">
                </div>
            </div>
        </div>
        <script type="text/javascript" src="script.js"></script>
    </body>
</html>
