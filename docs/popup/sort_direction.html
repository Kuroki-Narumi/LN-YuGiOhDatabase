<h3><img src="img/icons/ArrowUp.png" class="icon"><img src="img/icons/ArrowDown.png" class="icon">ソート方向</h3>
<ul>
    <li>
        並べ替える方向を指定します。
    </li>
    <li>
        <img src="img/icons/ArrowUp.png" class="icon16">: 昇順(小さいものが上、大きいほど下)
    </li>
    <li>
        <img src="img/icons/ArrowDown.png" class="icon16">: 降順(大きいものが上、小さいほど下)
    </li>
    <li>
        いずれの場合も、指定された性質を持たないカードは必ず末尾になります。
        <ul>
            <li>
                例: ソート条件が「守備力」の場合、守備力を持たない魔法・罠カードや<br>
                リンクモンスターは昇順でも降順でもリストの最後にまとめて配置される。
            </li>
        </ul>
    </li>
</ul>
