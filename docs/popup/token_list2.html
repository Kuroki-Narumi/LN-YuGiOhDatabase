<h3>除外するカード/参照するカード</h3>
<ul>
    <li>
        左のリストで何も選択していない場合、ここには<b>トークン以外</b>を指定する<br>
        効果や条件を持つカードが一覧されます。(以下例)<br>
        <ul>
            <li>
                魔鍵(トークン以外の通常モンスターを指定する)
            </li>
            <li>
                一部リンクモンスター(トークン以外をリンク素材に要求する)
            </li>
            <li>
                《エスケープ・ゴート》(トークン以外をリリースしてトークンを生成する)
            </li>
        </ul>
    </li>
    <li>
        左のリストでトークンを選択している場合、ここにはそのトークンを<br>
        <b>生成はしないが名指しで指定する</b>効果を持つカードが一覧されます。
    </li>
    <div class="common" src="common/cardLink.html"></div>
    <div class="common" src="common/singleSelection.html"></div>
</ul>
