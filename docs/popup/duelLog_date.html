<h3>日時</h3>
<ul>
    <li>
        対戦が行われた日時です。
    </li>
    <li>
        日付はカレンダー、時と分はドロップダウンで選択します。
    </li>
    <li>
        日付の上で<b>マウスホイール</b>を回すと<b>1日</b>ずつ変更します。
    </li>
    <li>
        時/分の上で<b>マウスホイール</b>を回すと<b>1</b>ずつ変更します。
    </li>
    <li>
        <img src="img/icons/Clock.png" class="icon16">を押すと現在時刻が入力されます。
    </li>
</ul>
