<h3>ドローソースの優先度</h3>
<ul>
    <li>
        手札に複数のドローソースがある場合に、<br>
        どのカードから優先して使うかを指定します。
        <ul>
            <li>
                <b>GoKin</b>:《強欲で金満な壺》
            </li>
            <li>
                <b>KinKen</b>:《金満で謙虚な壺》
            </li>
            <li>
                <b>Other</b>: その他の汎用ドローソース(《成金ゴブリン》など)
            </li>
            <li>
                <b>GoDon</b>:《強欲で貪欲な壺》
            </li>
            <li>
                <b>GoKen</b>:《強欲で謙虚な壺》
            </li>
        </ul>
    </li>
    <li>
        リストの上にあるものが優先されます。
    </li>
    <li>
        項目を選択して<img src="img/icons/ArrowUp.png" class="icon16">や<img src="img/icons/ArrowDown.png" class="icon16">を押すと上下に移動します。
    </li>
</ul>
