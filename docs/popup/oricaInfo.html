<h3>カード情報</h3>
<ul>
    <li>
        カードの種類やテキストなどを編集できます。
    </li>
    <li>
        コンボボックスとスライダーは<b>マウスホイール</b>でも変更できます。
    </li>
    <li>
        「ペンデュラム」をチェックするとPスケール及びP効果が編集可能になります。
    </li>
    <li>
        「リンクモンスター」を選択した場合、専用のUIが出現します。<br>
        <img src="img/01_04_database_orica_marker.png">
        <ul>
            <li>
                <b>マウス左ボタンを押しながらドラッグ</b>すると、通り過ぎた矢印が赤(有効)になります。
            </li>
            <li>
                <b>マウス右ボタンを押しながらドラッグ</b>すると、通り過ぎた矢印が灰色(無効)になります。
            </li>
        </ul>
    </li>
</ul>
