<h3>発売日</h3>
<ul>
    <li>
        公式データベースに記載されている「収録シリーズ」の発売日で絞り込みます。
        <ul>
            <li>
                「初登場」は、「収録シリーズ」のうち<b>最も古い日付</b>がその範囲内であるかを調べます。
            </li>
            <li>
                「最新収録」は「収録シリーズ」のうち<b>最も新しい日付</b>がその範囲内であるかを調べます。
            </li>
            <li>
                「OCG」「TCG」のいずれか一つにチェックを入れた場合は、それぞれのロケールにおける発売日だけを参照します。
            </li>
        </ul>
    </li>
    <div class="common" src="common/date_tips.html"></div>
</ul>
