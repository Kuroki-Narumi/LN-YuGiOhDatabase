<h3>参照するカード/生成するカード</h3>
<ul>
    <li>
        左のリストで何も選択していない場合、ここには<b>トークン名を指定せずに</b><br>
        トークンを参照する効果を持つカードが一覧されます。(以下例)<br>
        <ul>
            <li>
                トークン**祭(トークンを破壊したりリリースしたりする効果)
            </li>
            <li>
                幻獣機(自分フィールドにトークンが存在する限り自身は破壊されない)
            </li>
            <li>
                《白闘気双頭神龍》(自分フィールドに<b>トークンが無い場合</b>に発動できる)
            </li>
        </ul>
    </li>
    <li>
        左のリストでトークンを選択している場合、ここには<br>
        そのトークンを生成する効果を持つカードが一覧されます。
    </li>
    <div class="common" src="common/cardLink.html"></div>
    <div class="common" src="common/singleSelection.html"></div>
</ul>
