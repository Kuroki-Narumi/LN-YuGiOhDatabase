<h3>編集中アイテムの保存</h3>
<ul>
    <li>
        編集を確定し、リストの項目に変更を適用します。
    </li>
    <li>
        タグの名前を変更した場合、<b>全てのデュエルログに変更を適用</b>できます。
        <ul>
            <li>
                この操作は<b>元に戻せません</b>。デュエルログのバックアップを推奨します。
            </li>
        </ul>
    </li>
    <li>
        このボタンを押さずに他の項目を選択すると<b style="color: #f44;">編集状態は破棄される</b>ためご注意ください。
    </li>
</ul>
