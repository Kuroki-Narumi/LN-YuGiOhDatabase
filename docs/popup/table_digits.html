<h3>割合表示のオプション</h3>
<ul>
    <li>
        「スタイル」が「%(縦)」または「%(横)」の場合に、セルに表示する数値の形式を指定します。
    </li>
    <li>
        「小数点以下」が選択されている場合、<b>小数点以下の桁数</b>が指定値となるように表示されます。
    </li>
    <li>
        「全体」が選択されている場合、<b>小数点を含めた全体の桁数</b>が指定値となるように表示されます。
        <ul>
            <li>
                セルの<b>見た目の幅を揃えたい</b>ときに有用です。
            </li>
        </ul>
    </li>
    <li>
        いずれの場合も指定値に満たない桁は<span class="script">0</span>で埋められます。
    </li>
    <li>
        <b>この設定によらず、値が100%のセルには必ず<span class="script">100</span>と表示されます。</b>
    </li>
</ul>
