<h3>手札リスト</h3>
<ul>
    <li>
        手札に引きたいカードの一覧です。
        <ul>
            <li>
                詳細は後述の<a href="#hands">手札リストの詳細</a>を参照してください。
            </li>
        </ul>
    </li>
    <div class="common" src="common/multiSelection.html"></div>
    <li>
        <b>右クリック</b>すると選択されたカードを取り除きます。
    </li>
    <li>
        <b>ドラッグ&ドロップ</b>でカードを移動します。
        <ul>
            <li>
                デッキにドロップした場合は、手札からそのカードを取り除きます。
            </li>
            <li>
                別のサブリストにドロップした場合、そのサブリストに移動します。
            </li>
            <li>
                サブリストの外側にドロップした場合、新たにサブリストを作ります。
            </li>
        </ul>
    </li>
</ul>
