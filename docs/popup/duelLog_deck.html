<h3>カードリスト</h3>
<ul>
    <li>
        手札に追加するカードの候補です。
    </li>
    <div class="common" src="common/multiSelection.html"></div>
    <li>
        <b>右クリック</b>で選択された項目を手札に追加します。
        <ul>
            <li>
                「初期手札」が4枚以下の場合は「初期手札」に追加されます。
            </li>
            <li>
                「初期手札」が5枚以上の場合は「追加手札」に追加されます。
            </li>
        </ul>
    </li>
    <li>
        デッキに入っていないカードを追加したい場合は「全カード」のタブに<br>
        切り替えてください。
        <ul>
            <li>
                「全カード」タブでは文字列検索とソートが有効です。
            </li>
        </ul>
    </li>
</ul>
