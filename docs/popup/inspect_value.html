<h3>価値</h3>
<ul>
    <li>
        この条件が達成された場合に加算されるスコアです。
    </li>
    <li>
        <b>マウスホイール</b>を回すと<b>5</b>ずつ変更できます。
    </li>
    <li>
        この値を設定しなくても検証は機能しますが、<br>
        <b>手札の質を評価したい</b>場合には適切に設定してください。
    </li>
    <li>
        「価値1」と「価値2」は個別に計算されるため、<br>
        別軸の評価値として利用できます。
    </li>
</ul>
