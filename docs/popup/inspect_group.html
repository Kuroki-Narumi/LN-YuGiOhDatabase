<h3>グループ</h3>
<ul>
    <li>
        条件の排他グループを表す整数です。
    </li>
    <li>
        <b>マウスホイール</b>を回すと<b>1</b>ずつ変更できます。
    </li>
    <li>
        <a href="03_deck_inspect_exec.html">手札検証</a>の際、同じグループの条件は<b>リストの上から順に検証</b>され、<br>
        達成した場合<b>同じグループの他の条件はスキップ</b>されます。
    </li>
    <li>
        <b>異なるグループ</b>の条件はそれぞれ個別に検証され、同時に達成できます。
    </li>
</ul>
