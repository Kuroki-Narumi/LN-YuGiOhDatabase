<h3>テキスト形式の指定</h3>
<ul>
    <li>
        「クリップボードにコピー」でコピーされる文字列データの形式を指定します。
    </li>
    <li>
        <b>順序</b>: カード名とその枚数のどちらを先にするかを指定します。
    </li>
    <li>
        <b>区切り</b>: カード名とその枚数を区切る方法を指定します。
    </li>
    <li>
        <b>《》で囲む</b>: チェックするとカード名が<span class="script">《》</span>で囲まれます。
    </li>
    <li>
        例
        <ul>
            <li>
                順序「数→名前」、区切り「_x_」<br>
                <span class="script">1 x 雪天気シエル</span>
            </li>
            <li>
                順序「名前→数」、区切り「×」<br>
                <span class="script">雪天気シエル×1</span>
            </li>
            <li>
                順序「名前→数」、区切り「tab」、《》で囲む<br>
                <span class="script">《雪天気シエル》&Tab;1</span>
            </li>
        </ul>
    </li>
</ul>
