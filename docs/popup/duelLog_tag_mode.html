<h3>デッキタグのマッチモード</h3>
<div class="grid_9">
    <img src="img/filter_matchType.png" style="grid-area: left;"/>
    <ul style="grid-area: content;">
        <li>
            <b>いずれか</b>: 指定されたタグのうち、<b>いずれか1つ以上</b>を含むログがヒットします。
        </li>
        <li>
            <b>全て含む</b>: 指定されたタグを<b>全て含む</b>ログがヒットします。
        </li>
        <li>
            <b>最小一致</b>: <b>指定されていないタグを含まない</b>ようなログがヒットします。
        </li>
        <li>
            <b>完全一致</b>: 指定されたタグと<b>全く組み合わせ</b>のログがヒットします。
        </li>
    </ul>
</div>
