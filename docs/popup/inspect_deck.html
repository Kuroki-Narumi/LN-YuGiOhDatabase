<h3>カードリスト</h3>
<ul>
    <li>
        <a href="03_deck_edit.html">メインデッキ</a>に入っているカードの一覧です。
    </li>
    <div class="common" src="common/multiSelection.html"></div>
    <li>
        <b>右クリック</b>か<b>ドラッグ&ドロップ</b>で手札にカードを追加します。
        <ul>
            <li>
                右クリックの場合は最後に選択されたサブリスト<br>
                (何も選択していない場合は末尾のサブリスト)に追加します。
            </li>
            <li>
                D&Dの場合はドロップしたサブリストに追加します。<br>
                サブリストの外側にドロップすると新たにサブリストを作ります。
            </li>
        </ul>
    </li>
</ul>
