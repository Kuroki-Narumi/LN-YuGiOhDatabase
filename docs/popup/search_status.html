<h3>攻撃力/守備力</h3>
<ul>
    <li>
        <b>チェックした場合にのみ</b>右側のスライダーの範囲で絞り込みます。
    </li>
    <li>
        守備力をチェックした場合、リンクモンスターは候補から除外されます。
    </li>
    <li>
        攻守の<span class="script">?</span>表記は<span class="script">-1</span>扱いとなります。
    </li>
    <li>
        上限と下限は<b>それぞれ範囲に含みます</b>。
        <ul>
            <li>
                例: 攻撃力を<span class="script">1000-2000</span>とした場合、<b>攻撃力2000</b>のモンスターはヒットします。
            </li>
        </ul>
    </li>
    <li>
        「範囲外」をチェックすると判定基準が逆転します。
        <ul>
            <li>
                例: 攻撃力を<span class="script">1000-2000</span>とした場合、<br>
                攻撃力が1000<b>未満</b>または2000<b>より大きい</b>モンスターがヒットします。
            </li>
        </ul>
    </li>
</ul>
