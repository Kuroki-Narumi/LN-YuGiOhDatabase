<h3>検証結果(個別)</h3>
<ul>
    <li>
        手札検証のグループごとの達成回数の一覧です。
    </li>
    <li>
        <span class="script">Ctrl</span>キーを押しながら項目をクリックすると<b>複数選択</b>を行います。
    </li>
    <li>
        <span class="script">Shift</span>キーを押しながら項目をクリックすると<b>範囲選択</b>を行います。
    </li>
    <li>
        項目を複数選択した場合、リストの下部にその総合確率が表示されます。
        <ul>
            <li>
                同じグループは確率が合計されます。
            </li>
            <li>
                異なるグループは確率が乗算されます。
            </li>
        </ul>
    </li>
</ul>
