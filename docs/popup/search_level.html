<h3>レベル/ランク/リンク</h3>
<ul>
    <li>
        レベル/ランクについては<b>カード自体に記載された★の数</b>が参照されます。
    </li>
    <li>
        例: <a href="https://www.db.yugioh-card.com/yugiohdb/card_search.action?ope=2&cid=11413&request_locale=ja" target="_blank">《FNo.0 未来皇ホープ》</a>のテキストには「ルール上、このカードのランクは１として扱う。」と<br>
        書かれていますが、カードに記載された★の数は<span class="script">0</span>であるため(公式データベースでも「ランク0」)、<br>
        このカテゴリでは「0」がチェックされている場合にヒットします。
    </li>
</ul>
