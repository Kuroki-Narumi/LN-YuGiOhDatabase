<h3>項目セレクター</h3>
<ul>
    <li>
        表の縦及び横の列に表示する項目を選択します。<br>
        <img src="img/02_01_table_selector.png">
    </li>
    <li>
        コンボボックスの上で<b>マウスホイール</b>を回すと順に変更できます。
    </li>
    <li>
        「攻撃力」と「守備力」は<b>100刻み</b>となります。
    </li>
    <li>
        「リミット」は<a href="01_database_regulation.html">レギュレーション</a>で設定された内容を反映します。
    </li>
</ul>
